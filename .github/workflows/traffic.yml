name: Traffic

# GitHub's traffic API only exposes the last 14 days, so record it daily and
# keep the history in the repo.
#
# Run twice a day: GitHub does not guarantee on.schedule timeliness (runs can
# lag by hours), and the previous day's clone counts publish with a delay. The
# morning run catches data that is already ready; the afternoon run backfills
# whatever was still missing in the morning. The script is idempotent — a run
# that finds no new numbers does nothing, so the extra schedule is free.
on:
  schedule:
    - cron: "0 8 * * *"   # UTC 08:00
    - cron: "0 16 * * *"  # UTC 16:00 — backfills the morning if it was too early
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record clone traffic and render charts
        env:
          # The traffic API needs push access, which the default GITHUB_TOKEN
          # does not have and cannot be granted from here — this secret is the
          # only way in. Passing GITHUB_TOKEN too would only turn a missing
          # secret into a confusing 403.
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: python3 .github/scripts/traffic_chart.py

      - name: Commit any change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/traffic
          # The script only rewrites files when a day's numbers actually moved,
          # so a no-op run leaves the tree clean and this step exits quietly.
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update clone traffic"
          git push
